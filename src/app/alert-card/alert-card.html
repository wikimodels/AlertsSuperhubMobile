<mat-card class="alert-card mat-elevation-z4" [class.selected]="selected()" matRipple
  [matRippleColor]="'rgba(245, 158, 11, 0.3)'" (click)="toggle.emit()">

  <div class="card-header">
    <img [src]="alert().logoUrl || 'assets/logo/' + alert().symbol.toLowerCase() + '.svg'" [alt]="alert().symbol"
      class="coin-logo" (error)="$event.target.src='assets/logo/noname.svg'" />
    <div class="symbol-info">
      <span class="symbol">{{ alert().symbol }}</span>
      @if (alert().category) {
      <span class="category badge">Cat {{ alert().category }}</span>
      }
    </div>
    <img [src]="type() === 'line' ? 'assets/icons/alarm.svg' : 'assets/icons/anchor.svg'" [alt]="type()"
      class="type-icon" />
  </div>

  <mat-card-content class="card-body">
    @if (type() === 'line') {
    <div class="info-row">
      <span class="label">Name:</span>
      <span class="value">{{ alert().alertName }}</span>
    </div>
    }

    @if (type() === 'vwap') {
    <div class="info-row">
      <span class="label">Anchor:</span>
      <span class="value">{{ anchorTimeFormatted() }}</span>
    </div>
    }

    <div class="info-row time">
      <mat-icon class="tiny-icon" svgIcon="smart-alarm"></mat-icon>
      <span class="value">{{ activationTimeFormatted() }}</span>
    </div>
  </mat-card-content>
</mat-card>
